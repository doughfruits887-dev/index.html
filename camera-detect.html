<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>กล้องสแกน คน/สัตว์</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  #app { position: fixed; inset: 0; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  video { object-fit: cover; background: #000; }
  video.mirror { transform: scaleX(-1); }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,0));
    color: #fff; z-index: 5; pointer-events: none;
  }
  #status { font-size: 14px; text-shadow: 0 1px 3px #000; }
  #count { font-size: 14px; background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 999px; }

  #flip {
    position: absolute; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 24px);
    width: 62px; height: 62px; border-radius: 50%; border: 2px solid #fff;
    background: rgba(0,0,0,.45); color: #fff; font-size: 28px; z-index: 6;
    display: none; align-items: center; justify-content: center; cursor: pointer;
  }
  #flip:active { transform: scale(.92); }

  #start {
    position: absolute; inset: 0; z-index: 10; background: #111; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px;
  }
  #start h1 { font-size: 24px; }
  #start p { font-size: 15px; color: #bbb; max-width: 320px; line-height: 1.5; }
  #start button {
    font-size: 18px; padding: 14px 34px; border: 0; border-radius: 999px;
    background: #ffd800; color: #000; font-weight: 700; cursor: pointer;
  }
  #err { color: #ff6b6b; font-size: 14px; max-width: 320px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>

  <div id="topbar">
    <div id="status">กำลังเริ่ม...</div>
    <div id="count"></div>
  </div>

  <button id="flip" aria-label="สลับกล้อง">🔄</button>

  <div id="start">
    <h1>📷 สแกนคน / สัตว์</h1>
    <p>กดปุ่มด้านล่างแล้วกด "อนุญาต" เพื่อเปิดกล้อง ระบบจะตีกรอบสีเหลืองและบอกว่าเป็นคนหรือสัตว์ชนิดอะไร</p>
    <button id="startBtn">เปิดกล้อง</button>
    <div id="err"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
(() => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const countEl = document.getElementById('count');
  const startEl = document.getElementById('start');
  const startBtn = document.getElementById('startBtn');
  const errEl = document.getElementById('err');
  const flipBtn = document.getElementById('flip');

  // ชื่อที่ตรวจจับได้ (COCO-SSD มีสัตว์ 10 ชนิดนี้)
  const NAMES = {
    person: 'คน',
    bird: 'นก',
    cat: 'แมว',
    dog: 'สุนัข',
    horse: 'ม้า',
    sheep: 'แกะ',
    cow: 'วัว',
    elephant: 'ช้าง',
    bear: 'หมี',
    zebra: 'ม้าลาย',
    giraffe: 'ยีราฟ'
  };

  let model = null;
  let stream = null;
  let facing = 'environment';
  let running = false;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  resize();

  async function startCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    let s;
    try {
      s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch (e) {
      // ลองใหม่แบบไม่ระบุเงื่อนไข
      s = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }
    stream = s;
    video.srcObject = s;

    // ตรวจว่ากล้องที่ได้เป็นกล้องหน้าหรือไม่ เพื่อกลับด้านภาพให้เหมือนกระจก
    const settings = s.getVideoTracks()[0].getSettings();
    const isFront = settings.facingMode ? settings.facingMode === 'user' : facing === 'user';
    video.classList.toggle('mirror', isFront);
    video._mirror = isFront;

    await video.play();
  }

  async function init() {
    errEl.textContent = '';
    startBtn.disabled = true;
    startBtn.textContent = 'กำลังเปิด...';

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      errEl.textContent = 'เบราว์เซอร์นี้ไม่รองรับกล้อง หรือหน้าเว็บไม่ได้เปิดด้วย https';
      startBtn.disabled = false; startBtn.textContent = 'ลองอีกครั้ง';
      return;
    }

    try {
      await startCamera();
    } catch (e) {
      let msg = 'เปิดกล้องไม่ได้: ' + (e.message || e.name);
      if (e.name === 'NotAllowedError') msg = 'ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาไปที่ตั้งค่าเบราว์เซอร์ → อนุญาตกล้อง แล้วลองใหม่';
      if (e.name === 'NotFoundError') msg = 'ไม่พบกล้องในเครื่อง';
      errEl.textContent = msg;
      startBtn.disabled = false; startBtn.textContent = 'ลองอีกครั้ง';
      return;
    }

    startEl.style.display = 'none';
    flipBtn.style.display = 'flex';
    statusEl.textContent = 'กำลังโหลดโมเดล AI...';

    try {
      if (!model) model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    } catch (e) {
      statusEl.textContent = 'โหลดโมเดลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช';
      return;
    }
    statusEl.textContent = 'ส่องกล้องไปที่คนหรือสัตว์';
    if (!running) { running = true; loop(); }
  }

  startBtn.addEventListener('click', init);

  flipBtn.addEventListener('click', async () => {
    facing = facing === 'environment' ? 'user' : 'environment';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    try { await startCamera(); }
    catch (e) { statusEl.textContent = 'สลับกล้องไม่ได้'; facing = facing === 'environment' ? 'user' : 'environment'; }
  });

  // แปลงพิกัดวิดีโอ -> พิกัดหน้าจอ (object-fit: cover)
  function mapBox(b, vw, vh, cw, ch, mirror) {
    const scale = Math.max(cw / vw, ch / vh);
    const ox = (cw - vw * scale) / 2;
    const oy = (ch - vh * scale) / 2;
    let x = b[0] * scale + ox;
    const y = b[1] * scale + oy;
    const w = b[2] * scale;
    const h = b[3] * scale;
    if (mirror) x = cw - (x + w);
    return { x, y, w, h };
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(preds) {
    const cw = canvas.width, ch = canvas.height;
    ctx.clearRect(0, 0, cw, ch);
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;

    const mirror = !!video._mirror;
    const originX = cw / 2;
    const originY = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0) + 8 * dpr;

    let n = 0;
    for (const p of preds) {
      const name = NAMES[p.class];
      if (!name || p.score < 0.5) continue;
      n++;

      const { x, y, w, h } = mapBox(p.bbox, vw, vh, cw, ch, mirror);
      const pct = Math.round(p.score * 100);
      const text = `${name}  ${pct}%`;

      // ป้ายชื่อ (เหนือหัว)
      const fs = Math.max(15 * dpr, Math.min(22 * dpr, w * 0.14));
      ctx.font = `bold ${fs}px system-ui, -apple-system, Tahoma, sans-serif`;
      const tw = ctx.measureText(text).width;
      const padX = 12 * dpr, bh = fs + 14 * dpr, bw = tw + padX * 2;
      const cx = x + w / 2;
      let bx = Math.min(Math.max(cx - bw / 2, 4 * dpr), cw - bw - 4 * dpr);
      let by = y - bh - 8 * dpr;
      if (by < originY + 20 * dpr) by = y + 6 * dpr; // ถ้าหัวชิดขอบบน ให้วางป้ายในกรอบ

      // เส้นโยงจากบนสุดของจอ ไปหาป้าย/ตัวคน
      const tx = bx + bw / 2;
      const ty = by;
      ctx.strokeStyle = '#ffd800';
      ctx.lineWidth = 2.5 * dpr;
      ctx.shadowColor = 'rgba(0,0,0,.6)';
      ctx.shadowBlur = 4 * dpr;
      ctx.beginPath();
      ctx.moveTo(originX, originY);
      ctx.lineTo(tx, ty);
      ctx.stroke();

      // จุดเริ่มต้นเส้น
      ctx.fillStyle = '#ffd800';
      ctx.beginPath();
      ctx.arc(originX, originY, 5 * dpr, 0, Math.PI * 2);
      ctx.fill();

      // กรอบสี่เหลี่ยมสีเหลือง
      ctx.lineWidth = 3.5 * dpr;
      ctx.strokeRect(x, y, w, h);
      ctx.shadowBlur = 0;

      // แถบป้าย
      ctx.fillStyle = '#ffd800';
      roundRect(bx, by, bw, bh, 8 * dpr);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, bx + padX, by + bh / 2 + 1 * dpr);
    }
    countEl.textContent = n ? `พบ ${n}` : '';
    if (!n) statusEl.textContent = 'ส่องกล้องไปที่คนหรือสัตว์';
    else statusEl.textContent = 'กำลังสแกน...';
  }

  async function loop() {
    if (model && video.readyState >= 2 && !video.paused) {
      try {
        const preds = await model.detect(video, 20, 0.45);
        draw(preds);
      } catch (e) { /* ข้ามเฟรมที่พลาด */ }
    }
    requestAnimationFrame(loop);
  }

  // หยุดกล้องเมื่อสลับแอป/แท็บ แล้วเปิดใหม่เมื่อกลับมา
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) {
      if (stream) stream.getTracks().forEach(t => t.stop());
    } else if (startEl.style.display === 'none') {
      try { await startCamera(); } catch (e) { statusEl.textContent = 'เปิดกล้องใหม่ไม่ได้'; }
    }
  });
})();
</script>
</body>
</html>
