/* ===== patch.css =====
   

/* บล็อกเคอร์เซอร์/การคลุมดำ (ยกเว้นช่องกรอก) */
body *:not(#user-uid):not(input):not(textarea)not(#ta){
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none}

/* พื้นหลัง + สีสันหน้าหลัก */
body{background:linear-gradient(160deg,#e0e7ff 0%,#fce7f3 55%,#dcfce7 100%) fixed}

  background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2.4' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>") no-repeat right 16px center/20px;
  box-shadow:0 4px 12px #6366f122}

/* การ์ดลอย มีเงา */

/* ไอคอนไฟล์เป็นแผ่นกระดาษ มีมุมพับ */
.ic{position:relative;display:grid;align-items:end;justify-items:center;width:40px;height:50px;padding-bottom:4px;border:0;border-radius:4px 4px 5px 5px;
  background:linear-gradient(#fff 0 60%,#6366f1 60%);color:#fff;font-size:10px;font-weight:600;overflow:hidden;

.sub .ic::before{background:linear-gradient(225deg,#f8fafc 50%,#c7d2fe 50%)}
.ic::after{content:"";position:absolute;left:6px;right:6px;top:18px;height:11px;background:repeating-linear-gradient(#c7d2fe 0 2px,transparent 2px 6px)}

/* เมนู 3 จุด = ป๊อปอัปลอยข้างปุ่ม / กล่องยืนยันอยู่กลางจอ */

.sh{align-items:center;justify-content:center;padding:16px;background:#1b243088}

/* สีโค้ดแบบ GitHub: textarea โปร่ง ให้เห็นสีจากชั้นล่าง */

/* ป๊อปอัปเด้งกลับหน้าหลัก */
.gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:#1b2430aa;backdrop-filter:blur(4px)}
.gate>div{width:min(340px,100%);background:#fff;border-radius:22px;padding:24px 20px 18px;text-align:center;box-shadow:0 20px 50px #0005;display:flex;flex-direction:column;gap:10px}
.gate .gi{width:56px;height:68px;margin:0 auto 4px;border-radius:5px 5px 7px 7px;background:linear-gradient(#fff 0 55%,#6366f1 55%);box-shadow:0 4px 12px #4f46e555,inset 0 0 0 1px #c7d2fe;display:grid;align-items:end;justify-items:center;padding-bottom:6px;color:#fff;font-weight:600;font-size:13px}

.gate b{color:#4f46e5}
.gate button{padding:12px;border-radius:12px;font-weight:600}
.gate button.pri{background:linear-gradient(135deg,#6366f1,#06b6d4)}
.gate .sec{background:#eef2ff;color:#4f46e5}

<script>
const HOST='';/* ใส่โดเมนของคุณ เช่น 'myhost.com' ลิงก์จะเป็น https://myhost.com/ชื่อลิงก์ ถ้าเว้นว่างจะใช้ที่อยู่ของเว็บนี้ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function b64(u){let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}

 items.forEach(([t,fn,cl])=>{const b=document.createElement('button');b.textContent=t;if(cl)b.className=cl;b.onclick=()=>{d.remove();fn&&fn()};c.appendChild(b)});
 d.onclick=e=>{if(e.target===d)d.remove()};d.appendChild(c);document.body.appendChild(d)}

/* ---------- แสดงลิงก์ถาวร (ไม่ต้องล็อกอิน) / ตัวรันไฟล์ ---------- */
function build(fs){const m=fs.find(f=>/\.html?$/i.test(f.name))||fs.find(f=>f.main)||fs[0],e=ext(m.name);
 const by=u=>fs.find(f=>f!==m&&f.name===u.split(/[?#]/)[0].split('/').pop());
 if(m.is_binary)return(m.mime||'').startsWith('image/')?'<img style="max-width:100%" src="data:'+m.mime+';base64,'+m.content+'">':'<p style="font:16px sans-serif;padding:16px">ไฟล์นี้ไม่ใช่ข้อความ เปิดดูในเว็บไม่ได้ ให้ดาวน์โหลดแทน</p>';
 if(e==='html'||e==='htm'){let h=m.content;
  h=h.replace(/<link\b[^>]*href=["']([^"']+)["'][^>]*>/gi,(t,u)=>{const f=by(u);return f&&/stylesheet/i.test(t)?'<style>'+f.content+'</style>':t});
  return h.replace(/<script\b([^>]*?)src=["']([^"']+)["']([^>]*)>\s*<\/script>/gi,(t,a,u,b)=>{const f=by(u);return f?'<script'+a+b+'>'+f.content.replace(/<\/script/gi,'<\\/script')+'<\/script>':t})}
 if(e==='svg')return m.content;
 if(['js','mjs'].includes(e)){if(/\brequire\(|\bprocess\.|\bmodule\.exports/.test(m.content))return'<p style="font:16px sans-serif;padding:16px">ไฟล์นี้ใช้ Node (require/process) รันในเบราว์เซอร์ไม่ได้ ต้องรันบนเซิร์ฟเวอร์ที่มี Node</p>';
  return'<body style="font:14px monospace;padding:12px;white-space:pre-wrap"><div id=o></div><script>const o=document.getElementById("o"),p=(c,a)=>{const d=document.createElement("div");d.style.color=c;d.textContent=a.map(x=>typeof x==="object"?JSON.stringify(x):String(x)).join(" ");o.append(d)};console.log=(...a)=>p("#111",a);console.error=(...a)=>p("#c00",a);onerror=(m,s,l)=>p("#c00",["Error: "+m+" (บรรทัด "+l+")"]);<\/script><script>'+m.content.replace(/<\/script/gi,'<\\/script')+'<\/script>'}
 const srv=['py','java','c','cpp','cs','go','rs','php','rb','sh','kt','swift','sql'].includes(e)?'<p style="font:14px sans-serif;color:#92400e">ภาษานี้ต้องมีตัวรันบนเซิร์ฟเวอร์ รันในเบราว์เซอร์ไม่ได้ จึงแสดงเป็นข้อความ</p>':'';
 return srv+'<pre style="white-space:pre-wrap;font:14px monospace;padding:12px">'+esc(m.content)+'</pre>'}
function frame(fs){const f=document.createElement('iframe');f.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-modals');f.srcdoc=build(fs);return f}
async function viewer(o,soft){if(!soft)document.body.innerHTML='<p style="padding:20px">กำลังโหลด...</p>';
 const{data}=await(o.slug?sb.rpc('fm_public_by_slug',{p_slug:o.slug}):sb.rpc('fm_public_bundle',{p_id:o.id}));
 if(!data){if(soft)return false;document.body.innerHTML='<p style="padding:20px">ไม่พบลิงก์นี้ หรือเจ้าของยังไม่ได้สร้างลิงก์</p>';return true}
 document.title=data.name;document.body.innerHTML='';const f=frame(data.files);f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff';document.body.appendChild(f);return true}

/* ---------- รับโทเค็นจากหน้าหลัก (ไม่มีระบบล็อกอินในหน้านี้) ---------- */
const MAIN_URL='';/* ใส่ลิงก์หน้าหลัก (ไฟล์ 51) เช่น 'https://myhost.com/' ถ้าเว้นว่างจะใช้หน้าที่ลิงก์เข้ามา (referrer) */
const SB_URL='https://ztkqtvdllpzjsvlqxzni.supabase.co',SB_KEY='sb_publishable_BkDeJmZYwMys8OP4eMkpVQ_F6hrJ35t';
const mkSb=t=>supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},...(t?{global:{headers:{Authorization:'Bearer '+t}}}:{})});
let sb=mkSb();
const jwtExp=t=>{try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000}catch(e){return 0}};

 else{try{t=sessionStorage.getItem('fm-at')}catch(e){}}
 return t}

/* ป๊อปอัปเด้งกลับ: direct = เข้าลิงก์ตรงๆ, expired = โทเค็นหมดอายุ, late = หมดอายุระหว่างใช้งาน (ปิดได้ เผื่อกำลังแก้โค้ด) */
function gate(kind){document.querySelectorAll('.gate').forEach(x=>x.remove());
 const T={direct:['เข้าจากหน้าหลักเท่านั้น','หน้านี้ไม่มีระบบล็อกอิน ต้องกดเข้ามาจากหน้าหลักของเรา'],

 const d=document.createElement('div');d.className='gate';let n=5,tm2;const u=mainUrl(),auto=kind!=='late'&&u;

  tm2=setInterval(()=>{if(--n<=0)go();else paint()},1000)}}

/* ---------- หน้ารายการไฟล์ ---------- */

 return true}

 +kids(f).map((c,i)=>`<div class="row sub"><div class="nu">${n}.${i+1}</div>${icon(c)}<div class="nm"><b>${esc(c.name)}</b></div><button class="mb" onclick="smenu('${c.id}')">⋮</button></div>`).join('');

   if(w&&c!=='`'&&s[j]!==c)w.push({l:s.slice(0,i).split('\n').length+off,m:`เครื่องหมายคำพูด ${c} เปิดแล้วไม่ปิดในบรรทัดนี้`,f:`เติม ${c} ปิดท้ายสตริง`});
   r+=blank(s.slice(i,j+1));i=j+1}
  else{r+=c;i++}}return r}
function brackets(cl,w,off){const st=[],P={')':'(',']':'[','}':'{'},C={'(':')','[':']','{':'}'};let ln=1+off;
 for(const c of cl){if(c==='\n')ln++;else if(C[c])st.push([c,ln]);else if(P[c]){const t=st.pop();
  if(!t)w.push({l:ln,m:`มี ${c} เกินมา (ไม่มีตัวเปิด)`,f:`ลบ ${c} ออก`});
  else if(t[0]!==P[c])w.push({l:ln,m:`ปิดด้วย ${c} แต่ตัวที่เปิดค้างคือ ${t[0]} (บรรทัด ${t[1]})`,f:`ควรเป็น ${C[t[0]]}`})}}
 st.forEach(t=>w.push({l:t[1],m:`ขาดตัวปิดของ ${t[0]}`,f:`${t[0]} ... ${C[t[0]]}`}))}
function jsLint(code,w,off){const cl=strip(code,O_C,w,off);brackets(cl,w,off);const dec=new Set();let m;
 for(const re of[/\b(?:function\*?|class)\s+([A-Za-z_$][\w$]*)/g,/\b([A-Za-z_$][\w$]*)\s*=>/g])while(m=re.exec(cl))dec.add(m[1]);
 const rv=/\b(?:const|let|var)\s+([^;]+?)(?=[;\n]|$)/g;
 while(m=rv.exec(cl)){m[1].split(',').forEach(part=>{const cp=part.replace(/[\{\}\[\]]/g,''),im=cp.match(/^\s*([A-Za-z_$][\w$]*)/);if(im)dec.add(im[1])})}
 const rp=/\(([^()]*)\)\s*(?:=>|\{)/g;while(m=rp.exec(cl))m[1].split(',').forEach(p=>{const x=p.split('=')[0].trim().replace(/^\.\.\./,'');if(/^[A-Za-z_$][\w$]*$/.test(x))dec.add(x)});

 const names=[...dec];
 cl.split('\n').forEach((ln,i)=>{const seen=new Set(),re=/(?<![\w$.])[A-Za-z_$][\w$]*/g;let k;
  while(k=re.exec(ln)){const t=k[0];if(seen.has(t)||dec.has(t)||GL.includes(t)||/^\s*:/.test(ln.slice(k.index+t.length)))continue;seen.add(t);
   if(KW.includes(t))continue;
   const kw=KW.find(w2=>t!==w2&&(w2.toLowerCase()===t.toLowerCase()||(w2.length>=4&&lev(w2,t)===1)));
   if(kw){w.push({l:i+1+off,m:`"${t}" สะกด/ตัวพิมพ์ไม่ตรงคำสั่ง`,f:`ควรเป็น ${kw}`});continue}
   const s=names.find(n=>n.length>=3&&(n.toLowerCase()===t.toLowerCase()||(t.length>=3&&n.length>=5&&lev(n,t)<=2)||(t.length>=3&&lev(n,t)<=1)));
   if(s)w.push({l:i+1+off,m:`"${t}" ไม่มีในโค้ด อาจหมายถึง "${s}"`,f:`ใช้ ${s} ให้ตรงตัวแปรหลัก`})}})}

 clean=clean.replace(re0,(t,a,b,c)=>t.replace(c,blank(c)));
 const st=[],re=/<(\/?)([a-zA-Z][\w-]*)\b[^>]*?(\/?)>/g;let last=0,ln=1;
 while(m=re.exec(clean)){ln+=clean.slice(last,m.index).split('\n').length-1;last=m.index;const n=m[2].toLowerCase();
  if(!m[1]){if(!xml&&!TAGS.includes(n)&&!n.includes('-')){const s=TAGS.find(t=>lev(t,n)<=1&&n.length>2);if(s)w.push({l:ln,m:`แท็ก <${n}> ไม่รู้จัก อาจหมายถึง <${s}>`,f:`<${s}>`})}
   if(!(xml?[]:VOID).includes(n)&&!m[3])st.push([n,ln])}
  else if(!xml&&VOID.includes(n))w.push({l:ln,m:`</${n}> ไม่ต้องมีแท็กปิด`,f:`ลบ </${n}>`});
  else{const i=st.map(x=>x[0]).lastIndexOf(n);if(i<0)w.push({l:ln,m:`มี </${n}> เกินมา ไม่มี <${n}> ที่เปิดไว้`,f:`ลบ </${n}> หรือเติม <${n}>`});
   else{st.splice(i+1).forEach(x=>w.push({l:x[1],m:`<${x[0]}> ไม่มีแท็กปิดก่อนถึง </${n}> (บรรทัด ${ln})`,f:`<${x[0]}> ... </${x[0]}>`}));st.pop()}}}
 st.forEach(x=>w.push({l:x[1],m:`ขาด </${x[0]}> ของ <${x[0]}>`,f:`<${x[0]}> ... </${x[0]}>`}))}
const KWC='if else for while switch case break continue return class public private protected static void new function package import interface struct enum try catch finally throw const final extends implements namespace using abstract default'.split(' ');
const KWP='def class return import from elif else while try except finally with lambda yield pass break continue raise assert global nonlocal'.split(' ');
const KWS='select from where insert into values update delete create table alter drop join group order having limit distinct union'.split(' ');

const L={};const reg=(x,o)=>x.split(' ').forEach(e=>L[e]=o);
reg('java c h cpp cc hpp cs go kt kts swift dart scala groovy ts tsx jsx',{o:O_C,kw:KWC,w:1});
reg('php',{o:O_C,kw:KWC});reg('rs',{o:{l:'//',b:1,q:'"'},kw:KWC});
reg('py pyw',{o:O_H,kw:KWP,py:1,w:1});reg('rb pl r toml conf cfg ini env gitignore dockerfile makefile mk',{o:O_H,kw:[]});
reg('sh bash zsh',{o:{l:'#',b:0,q:'"\''},kw:KWH});reg('yml yaml',{o:O_H,kw:[],yaml:1});
reg('sql',{o:O_D,kw:KWS,ci:1,w:1});reg('lua hs',{o:O_D,kw:[]});
function kwTypos(cl,kws,w,ci){const cnt={};cl.replace(/[A-Za-z_]\w*/g,t=>{cnt[t]=(cnt[t]||0)+1});
 cl.split('\n').forEach((ln,i)=>{const re=/(?<![\w$.@:])[A-Za-z_]\w*/g;let k;while(k=re.exec(ln)){const t=k[0],x=ci?t.toLowerCase():t;
  if(cnt[t]>1||kws.includes(x)||t.length<4)continue;
  const kw=kws.find(y=>y.length>=4&&((!ci&&y.toLowerCase()===t.toLowerCase())||lev(y,x)===1));
  if(kw)w.push({l:i+1,m:`"${t}" อาจสะกดผิด ไม่ตรงคำสั่งในภาษานี้`,f:`ควรเป็น ${kw}`})}})}
function pyLint(cl,w){const Ls=cl.split('\n'),ind=s=>s.match(/^[ \t]*/)[0].length;let tabs=0,sp=0,open=0,prev=null;
 Ls.forEach((ln,i)=>{if(/^\t/.test(ln))tabs=tabs||i+1;if(/^ /.test(ln))sp=sp||i+1});
 if(tabs&&sp)w.push({l:tabs,m:'ย่อหน้าปนกันระหว่างแท็บกับเว้นวรรค Python จะ error',f:'เลือกอย่างเดียว (แนะนำเว้นวรรค 4 ตัว)'});
 Ls.forEach((ln,i)=>{const t=ln.trim(),was=open;for(const c of ln){if('([{'.includes(c))open++;else if(')]}'.includes(c))open--}
  if(!t||was>0)return;
  if(prev&&prev.c&&ind(ln)<=prev.i)w.push({l:i+1,m:`ต้องย่อหน้าเข้าไปใต้บรรทัด ${prev.l} ที่ลงท้ายด้วย :`,f:'เพิ่มเว้นวรรค 4 ตัวหน้าบรรทัดนี้'});
  const hd=/^(def|class|if|elif|else|for|while|try|except|finally|with|async\s+(def|for|with))\b/.test(t),co=/:\s*$/.test(t);
  if(hd&&!co&&!/:\s*\S/.test(t)&&open===0)w.push({l:i+1,m:'ขาด : ท้ายบรรทัดนี้',f:t+':'});

function generic(code,c,w){const cl=strip(code,c.o,c.w?w:null);brackets(cl,w,0);if(c.kw.length)kwTypos(cl,c.kw,w,c.ci);if(c.py)pyLint(cl,w);

function lint(name,code){const b=name.toLowerCase(),e=ext(name),k=e||b,w=[];

  catch(x){const p=/position (\d+)/.exec(x.message);w.push({l:p?code.slice(0,+p[1]).split('\n').length:1,m:'JSON ผิดรูปแบบ: '+x.message})}}

 else if(['css','scss','less'].includes(e))brackets(strip(code,O_CSS),w,0);else if(['js','mjs','cjs'].includes(e))jsLint(code,w,0);

// ---------- สีโค้ดแบบ GitHub ----------
const R_STR=/"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?|`(?:\\[\s\S]|[^`\\])*`?/.source;
const R_CM={c:/\/\*[\s\S]*?(?:\*\/|$)|\/\/[^\n]*/.source,h:/#[^\n]*/.source,d:/--[^\n]*/.source,css:/\/\*[\s\S]*?(?:\*\/|$)/.source};
const HJ=new Set('function return const let var if else for while do switch case break continue new class extends import export from default async await try catch finally throw typeof instanceof in of delete void yield static this super public private protected final package using namespace struct enum interface abstract implements fn mut impl pub use mod match'.split(' '));
const HP=new Set('def class return import from as if elif else for while try except finally with lambda yield pass break continue raise assert global nonlocal in not and or is then fi done esac function local export'.split(' '));
const HS=new Set('select from where insert into values update set create table alter drop join group order by having limit distinct union and or not null as on left right inner outer'.split(' '));
const HC=new Set('true false null undefined NaN None True False nil'.split(' '));
function hlCode(code,lang){
 const css=lang==='css',cm=css?'css':(lang==='py'||lang==='sh')?'h':lang==='sql'?'d':'c',K=(lang==='py'||lang==='sh')?HP:lang==='sql'?HS:HJ;
 const re=new RegExp('('+R_CM[cm]+')|('+R_STR+')|'+(css?'([.#][\\w-]+)|(@?-?[A-Za-z_][\\w-]*)':'()([A-Za-z_$][\\w$]*)')+'|(\\b\\d[\\w.]*)','g');
 let out='',last=0,m;
 while(m=re.exec(code)){
  out+=esc(code.slice(last,m.index));last=re.lastIndex;
  const t=m[0];let c='';
  if(m[1])c='#6e7781';else if(m[2])c='#0a3069';else if(m[5])c='#0550ae';else if(m[3])c='#0550ae';
  else{const nx=code.slice(re.lastIndex,re.lastIndex+40).match(/^\s*([(:])/);
   if(css)c=t[0]==='@'?'#cf222e':(nx&&nx[1]===':'?'#0550ae':'');
   else if(K.has(lang==='sql'?t.toLowerCase():t))c='#cf222e';
   else if(HC.has(t))c='#0550ae';
   else if(nx&&nx[1]==='(')c='#8250df';
   else if(/^[A-Z]/.test(t))c='#953800'}
  out+=c?'<span style="color:'+c+'">'+esc(t)+'</span>':esc(t)}
 return out+esc(code.slice(last))}
function hlTag(s){const m=/^(<\/?)([\w:-]+)([\s\S]*?)(\/?>?)$/.exec(s);if(!m)return esc(s);
 let a='',l=0,x;const r=/([^\s=]+)(\s*=\s*)?("[^"]*"|'[^']*'|[^\s"'>]+)?/g;
 while(x=r.exec(m[3])){a+=esc(m[3].slice(l,x.index))+'<span style="color:#0550ae">'+esc(x[1])+'</span>'+esc(x[2]||'')+(x[3]?'<span style="color:#0a3069">'+esc(x[3])+'</span>':'');l=r.lastIndex}
 return esc(m[1])+'<span style="color:#116329">'+esc(m[2])+'</span>'+a+esc(m[3].slice(l))+esc(m[4])}
function hlHtml(code){
 const re=/(<!--[\s\S]*?(?:-->|$))|(<(script|style)\b[^>]*>)([\s\S]*?)(<\/\3\s*>|$)|(<\/?[A-Za-z][^>]*>?)/gi;
 let out='',last=0,m;
 while(m=re.exec(code)){
  out+=esc(code.slice(last,m.index));last=re.lastIndex;
  if(m[1])out+='<span style="color:#6e7781">'+esc(m[1])+'</span>';
  else if(m[2]){const L=m[3].toLowerCase()==='style'?'css':'js';
   out+=hlTag(m[2])+(/\bsrc\s*=/i.test(m[2])?esc(m[4]):hlCode(m[4],L))+(m[5]?hlTag(m[5]):'')}
  else out+=hlTag(m[6])}
 return out+esc(code.slice(last))}
function hl(name,code){const e=ext(name);if(code.length>150000)return null;
 if(/^(html?|xml|svg|xhtml)$/.test(e))return hlHtml(code);
 if(/^(css|scss|less)$/.test(e))return hlCode(code,'css');
 if(/^(py|pyw)$/.test(e))return hlCode(code,'py');
 if(/^(sh|bash|zsh|yml|yaml|toml|conf|ini|rb|env)$/.test(e))return hlCode(code,'sh');
 if(e==='sql')return hlCode(code,'sql');
 if(/^(md|txt|csv|log|)$/.test(e))return esc(code);
 return hlCode(code,'js')}

<div id="wp" hidden></div><div class="ed"><div id="gt"><div id="gi"></div></div><div id="hl"><div id="hi"></div><pre id="hc"></pre></div><textarea id="ta" wrap="off" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea></div>`;
