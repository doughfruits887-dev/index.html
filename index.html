<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>กล้องสแกน คน/สัตว์</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  #app { position: fixed; inset: 0; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  video { object-fit: cover; background: #000; }
  video.mirror { transform: scaleX(-1); }
  canvas { pointer-events: none; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,0));
    color: #fff; z-index: 5; pointer-events: none;
  }
  #status { font-size: 14px; text-shadow: 0 1px 3px #000; }
  #count { font-size: 14px; background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 999px; }

  #flip {
    position: absolute; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 24px);
    width: 62px; height: 62px; border-radius: 50%; border: 2px solid #fff;
    background: rgba(0,0,0,.45); color: #fff; font-size: 28px; z-index: 6;
    display: none; align-items: center; justify-content: center; cursor: pointer;
  }
  #flip:active { transform: scale(.92); }

  #start {
    position: absolute; inset: 0; z-index: 10; background: #111; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px;
  }
  #start h1 { font-size: 24px; }
  #start p { font-size: 15px; color: #bbb; max-width: 320px; line-height: 1.5; }
  #start button {
    font-size: 18px; padding: 14px 34px; border: 0; border-radius: 999px;
    background: #ffd800; color: #000; font-weight: 700; cursor: pointer;
  }
  #err { color: #ff6b6b; font-size: 14px; max-width: 320px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>

  <div id="topbar">
    <div id="status">กำลังเริ่ม...</div>
    <div id="count"></div>
  </div>

  <button id="flip" aria-label="สลับกล้อง">🔄</button>

  <div id="start">
    <h1>📷 สแกนคน / สัตว์</h1>
    <p>กดปุ่มด้านล่างแล้วกด "อนุญาต" เพื่อเปิดกล้อง ระบบจะตีกรอบสีเหลืองและบอกว่าเป็นคนหรือสัตว์ชนิดอะไร</p>
    <button id="startBtn">เปิดกล้อง</button>
    <div id="err"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
(() => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const countEl = document.getElementById('count');
  const startEl = document.getElementById('start');
  const startBtn = document.getElementById('startBtn');
  const errEl = document.getElementById('err');
  const flipBtn = document.getElementById('flip');

  const NAMES = {
    person: 'คน', bird: 'นก', cat: 'แมว', dog: 'สุนัข', horse: 'ม้า',
    sheep: 'แกะ', cow: 'วัว', elephant: 'ช้าง', bear: 'หมี',
    zebra: 'ม้าลาย', giraffe: 'ยีราฟ'
  };

  // ---- ตั้งค่าความเร็ว ----
  const DETECT_WIDTH = 256;      // ย่อภาพก่อนส่งให้ AI (เล็กลง = เร็วขึ้น)
  const DETECT_INTERVAL = 120;   // ms พักระหว่างรอบตรวจจับ ให้กล้องลื่น
  const MIN_SCORE = 0.5;

  let model = null, stream = null, facing = 'environment';
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let started = false;

  // กรอบที่ตรวจเจอ (พิกัดวิดีโอ) + กรอบที่กำลังแสดง (เกลี่ยให้ลื่น)
  let targets = [];
  let shown = [];

  const small = document.createElement('canvas');
  const sctx = small.getContext('2d', { willReadFrequently: false });

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  resize();

  async function startCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    let s;
    try {
      s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 960 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
        audio: false
      });
    } catch (e) {
      s = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }
    stream = s;
    video.srcObject = s;
    const st = s.getVideoTracks()[0].getSettings();
    const isFront = st.facingMode ? st.facingMode === 'user' : facing === 'user';
    video.classList.toggle('mirror', isFront);
    video._mirror = isFront;
    targets = []; shown = [];
    await video.play();
  }

  async function initModel() {
    // เลือก backend ที่เร็วที่สุด: webgl -> cpu
    let ok = false;
    try { ok = await tf.setBackend('webgl'); } catch (e) { ok = false; }
    if (!ok) { await tf.setBackend('cpu'); }
    await tf.ready();
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });

    // วอร์มอัพ 1 รอบ (รอบแรกช้าเพราะต้องคอมไพล์ shader)
    small.width = DETECT_WIDTH; small.height = Math.round(DETECT_WIDTH * 0.75);
    await model.detect(small, 5, 0.9);
  }

  async function init() {
    errEl.textContent = '';
    startBtn.disabled = true;
    startBtn.textContent = 'กำลังเปิด...';

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      errEl.textContent = 'เบราว์เซอร์นี้ไม่รองรับกล้อง หรือหน้าเว็บไม่ได้เปิดด้วย https';
      startBtn.disabled = false; startBtn.textContent = 'ลองอีกครั้ง';
      return;
    }
    try {
      await startCamera();
    } catch (e) {
      let msg = 'เปิดกล้องไม่ได้: ' + (e.message || e.name);
      if (e.name === 'NotAllowedError') msg = 'ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาไปที่ตั้งค่าเบราว์เซอร์ → อนุญาตกล้อง แล้วลองใหม่';
      if (e.name === 'NotFoundError') msg = 'ไม่พบกล้องในเครื่อง';
      errEl.textContent = msg;
      startBtn.disabled = false; startBtn.textContent = 'ลองอีกครั้ง';
      return;
    }

    startEl.style.display = 'none';
    flipBtn.style.display = 'flex';
    statusEl.textContent = 'กำลังโหลดโมเดล AI...';

    try {
      if (!model) await initModel();
    } catch (e) {
      statusEl.textContent = 'โหลดโมเดลไม่สำเร็จ: ' + (e.message || e);
      return;
    }
    statusEl.textContent = 'ส่องกล้องไปที่คนหรือสัตว์ (' + tf.getBackend() + ')';
    if (!started) { started = true; detectLoop(); renderLoop(); }
  }

  startBtn.addEventListener('click', init);

  flipBtn.addEventListener('click', async () => {
    const prev = facing;
    facing = facing === 'environment' ? 'user' : 'environment';
    try { await startCamera(); }
    catch (e) { facing = prev; statusEl.textContent = 'สลับกล้องไม่ได้'; try { await startCamera(); } catch (_) {} }
  });

  // ---------- ตรวจจับ (ทำงานแยก ไม่บล็อกการวาด) ----------
  async function detectLoop() {
    const t0 = performance.now();
    try {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (model && vw && vh && video.readyState >= 2) {
        const sw = DETECT_WIDTH, sh = Math.round(DETECT_WIDTH * vh / vw);
        if (small.width !== sw || small.height !== sh) { small.width = sw; small.height = sh; }
        sctx.drawImage(video, 0, 0, sw, sh);
        const preds = await model.detect(small, 15, 0.4);
        const k = vw / sw;
        targets = preds
          .filter(p => NAMES[p.class] && p.score >= MIN_SCORE)
          .map(p => ({
            cls: p.class, score: p.score,
            x: p.bbox[0] * k, y: p.bbox[1] * k, w: p.bbox[2] * k, h: p.bbox[3] * k
          }));
      }
    } catch (e) {
      statusEl.textContent = 'AI error: ' + (e.message || e);
    }
    const took = performance.now() - t0;
    setTimeout(detectLoop, Math.max(DETECT_INTERVAL - took, 30));
  }

  // ---------- วาด (ลื่น 60fps โดยเกลี่ยกรอบเข้าหาตำแหน่งจริง) ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function smooth() {
    // จับคู่กรอบเดิมกับกรอบใหม่ (ชนิดเดียวกัน + ใกล้กันสุด)
    const used = new Set();
    const next = [];
    for (const t of targets) {
      let best = -1, bd = Infinity;
      shown.forEach((s, i) => {
        if (used.has(i) || s.cls !== t.cls) return;
        const d = Math.hypot((s.x + s.w / 2) - (t.x + t.w / 2), (s.y + s.h / 2) - (t.y + t.h / 2));
        if (d < bd) { bd = d; best = i; }
      });
      if (best >= 0 && bd < Math.max(t.w, t.h)) {
        used.add(best);
        const s = shown[best], a = 0.35;
        next.push({ cls: t.cls, score: t.score,
          x: s.x + (t.x - s.x) * a, y: s.y + (t.y - s.y) * a,
          w: s.w + (t.w - s.w) * a, h: s.h + (t.h - s.h) * a });
      } else {
        next.push({ ...t });
      }
    }
    shown = next;
  }

  function renderLoop() {
    requestAnimationFrame(renderLoop);
    const cw = canvas.width, ch = canvas.height;
    ctx.clearRect(0, 0, cw, ch);
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;
    smooth();

    const mirror = !!video._mirror;
    const scale = Math.max(cw / vw, ch / vh);
    const ox = (cw - vw * scale) / 2, oy = (ch - vh * scale) / 2;
    const originX = cw / 2, originY = 8 * dpr;

    for (const p of shown) {
      let x = p.x * scale + ox;
      const y = p.y * scale + oy, w = p.w * scale, h = p.h * scale;
      if (mirror) x = cw - (x + w);

      const text = `${NAMES[p.cls]}  ${Math.round(p.score * 100)}%`;
      const fs = Math.max(15 * dpr, Math.min(22 * dpr, w * 0.14));
      ctx.font = `bold ${fs}px system-ui, -apple-system, Tahoma, sans-serif`;
      const tw = ctx.measureText(text).width;
      const padX = 12 * dpr, bh = fs + 14 * dpr, bw = tw + padX * 2;
      const bx = Math.min(Math.max(x + w / 2 - bw / 2, 4 * dpr), cw - bw - 4 * dpr);
      let by = y - bh - 8 * dpr;
      if (by < originY + 20 * dpr) by = y + 6 * dpr;

      ctx.strokeStyle = '#ffd800';
      ctx.lineWidth = 2.5 * dpr;
      ctx.beginPath();
      ctx.moveTo(originX, originY);
      ctx.lineTo(bx + bw / 2, by);
      ctx.stroke();

      ctx.fillStyle = '#ffd800';
      ctx.beginPath();
      ctx.arc(originX, originY, 5 * dpr, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = 3.5 * dpr;
      ctx.strokeRect(x, y, w, h);

      roundRect(bx, by, bw, bh, 8 * dpr);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, bx + padX, by + bh / 2 + 1 * dpr);
    }
    countEl.textContent = shown.length ? `พบ ${shown.length}` : '';
  }

  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) {
      if (stream) stream.getTracks().forEach(t => t.stop());
    } else if (startEl.style.display === 'none') {
      try { await startCamera(); } catch (e) { statusEl.textContent = 'เปิดกล้องใหม่ไม่ได้'; }
    }
  });
})();
</script>
</body>
</html>
