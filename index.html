<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านขายไอดี Free Fire พรีเมียม | Sadina Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            min-height: 100vh;
        }

        /* 🌫️ พื้นหลังรูปภาพแบบเบลอ ให้เข้ากับหน้าหลัก */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('https://i.ibb.co/3YpWxb5J/FB-IMG-1787390135699.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(10px) brightness(0.4);
            transform: scale(1.1);
            z-index: -1;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #FDE047 0%, #D97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-border-glow {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.25);
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="pb-12">

    <!-- 📌 NAVBAR & BAR แสดงข้อมูลผู้ใช้ -->
    <nav class="sticky top-0 z-40 glass-card border-b border-white/10 px-4 py-3">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            
            <!-- ปุ่มย้อนกลับหน้าหลัก -->
            <button onclick="goBackMain()" class="flex items-center gap-2 bg-slate-800/80 hover:bg-slate-700 text-amber-400 border border-amber-500/30 px-3.5 py-1.5 rounded-xl text-xs font-bold transition active:scale-95 shadow-lg">
                <i class="fa-solid fa-arrow-left"></i>
                <span>กลับหน้าหลัก</span>
            </button>

            <!-- โลโก้ร้าน -->
            <div class="flex items-center gap-2">
                <span class="text-xl">🔥</span>
                <h1 class="text-base font-black tracking-wide gold-gradient-text hidden sm:block">SADINA SHOP</h1>
            </div>

            <!-- กล่องแสดง Session ผู้ใช้ -->
            <div class="flex items-center gap-2 bg-slate-900/90 border border-white/10 rounded-full pl-1.5 pr-3 py-1">
                <img id="user-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=FF" alt="Avatar" class="w-7 h-7 rounded-full border border-amber-400 bg-slate-800">
                <div class="text-left">
                    <p id="user-name" class="text-[11px] font-bold text-slate-200 leading-none truncate max-w-[90px]">กำลังยืนยัน...</p>
                    <p id="user-status" class="text-[9px] font-medium text-emerald-400 leading-none mt-0.5">● สมาชิกออนไลน์</p>
                </div>
            </div>

        </div>
    </nav>

    <!-- 🏆 HERO SECTION & TITLE -->
    <header class="max-w-6xl mx-auto px-4 pt-6 pb-4 text-center">
        <div class="inline-flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-3 py-1 rounded-full mb-3">
            <span class="animate-ping w-2 h-2 rounded-full bg-amber-400"></span>
            <span class="text-[11px] font-bold text-amber-300 uppercase tracking-wider">ร้านค้าไอดีเกม Free Fire พรีเมียม</span>
        </div>
        <h2 class="text-2xl sm:text-4xl font-black text-white mb-2">เลือกซื้อไอดี Free Fire <span class="gold-gradient-text">ปลอดภัย 100%</span></h2>
        <p class="text-xs sm:text-sm text-slate-400 max-w-xl mx-auto">ไอดีสะอาด ไม่ติดสี ประวัติการผูกชัดเจน รับประกันหลังการขายตลอดอายุการใช้งาน</p>
    </header>

    <!-- 🔍 SEARCH & FILTER BAR -->
    <section class="max-w-6xl mx-auto px-4 mb-6">
        <div class="glass-card rounded-2xl p-3 sm:p-4 border border-white/10 ">
            <!-- ช่องค้นหา -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="ค้นหารหัสไอดี, สกินปืน, ท่าทาง..." class="w-full pl-9 pr-4 py-2 bg-slate-900/90 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition">
            </div>
        </div>
    </section>

    <!-- 🛒 PRODUCT GRID (รายการไอดี) -->
    <main class="max-w-6xl mx-auto px-4">
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- สินค้าจะถูก Render จาก JavaScript -->
        </div>
    </main>

    <!-- 💳 BUY / DETAILS MODAL (หน้าต่างสั่งซื้อ) -->
    <div id="buyModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md" onclick="if(event.target===this) closeModal()">
        <div class="glass-card w-full max-w-md rounded-3xl p-5 border border-amber-500/30 text-slate-100 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg w-8 h-8 flex items-center justify-center bg-slate-800/80 rounded-full">✕</button>

            <div id="modalContent">
                <!-- ข้อมูลรายละเอียดสินค้าและปุ่มชำระเงินจะโชว์ตรงนี้ -->
            </div>
        </div>
    </div>

    <!-- 📜 JAVASCRIPT LOGIC -->
    <script>
        // Config Supabase (ตั้งค่าเดียวกับหน้าหลักของคุณ)
        const SUPABASE_URL = 'https://ztkqtvdllpzjsvlqxzni.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_BkDeJmZYwMys8OP4eMkpVQ_F6hrJ35t';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let userSessionToken = null;

        // 📦 รายการไอดี Free Fire ตัวอย่าง
        const products = [
            {
                id: 'FF-8801',
                title: 'ไอดีสายแข่ง เลเวล 78 | ชุดตระกูลหมอนทอง complete',
                price: 1290,
                oldPrice: 1890,
                bind: 'Facebook (โอนสายสะอาด)',
                img: 'https://i.ibb.co/FLyWLKp2/19-20261104115143.png',
                badges: ['🔥 สกินแรร์', '✅ ประวัติสะอาด'],
                highlights: ['ปืน Evo LV.7 (AK Dragon)', 'ชุด Grandmaster Season 28', 'บัฟเพชรเหลือ 450 เพชร']
            },
            {
                id: 'FF-8802',
                title: 'ไอดีตึง GM63 | ปืนวิวัฒนาการเต็ม 4 กาบ',
                price: 2450,
                oldPrice: 3200,
                bind: 'VK (เปลี่ยนเมลได้)',
                img: 'https://i.ibb.co/FLyWLKp2/19-20261104115143.png',
                badges: ['🏆 Grandmaster', '👑 EVO MAX'],
                highlights: ['MP40 Cobra LV.7', 'M1014 Green Attack LV.7', 'ท่าทางไฮไลท์ 18 ท่า']
            },
            {
                id: 'FF-8803',
                title: 'ไอดีเริ่มต้นสายคุ้ม | เพชรติดตัว 1,500 + สกินครบ',
                price: 350,
                oldPrice: 590,
                bind: 'Gmail (ยกเมล)',
                img: 'https://i.ibb.co/FLyWLKp2/19-20261104115143.png',
                badges: ['🎰 ไอดีเริ่มต้น', '💎 1500 เพชร'],
                highlights: ['มีตัวละคร Alok + Homero', 'สกินปืนสีเหลืองครบเซ็ต', 'เหมาะสำหรับเอาไปทำไอดีหลัก']
            }
        ];

        // 🔐 ระบบตรวจจับ Session จาก Hash URL (`#at=...`) ที่ส่งมาจากหน้าหลัก
        async function initSession() {
            const hash = window.location.hash;
            if (hash && hash.includes('at=')) {
                userSessionToken = decodeURIComponent(hash.split('at=')[1].split('&')[0]);
                
                // ตรวจสอบและดึงข้อมูลโปรไฟล์จาก Supabase
                try {
                    const { data: { user }, error } = await supabaseClient.auth.getUser(userSessionToken);
                    if (user) {
                        // ดึงข้อมูล Username / Avatar จาก Table profiles
                        const { data: profile } = await supabaseClient
                            .from('profiles')
                            .select('username, avatar_url')
                            .eq('id', user.id)
                            .maybeSingle();

                        const username = profile?.username || user.user_metadata?.username || user.email?.split('@')[0] || 'ผู้ใช้';
                        const avatar = profile?.avatar_url || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + username;

                        document.getElementById('user-name').textContent = username;
                        document.getElementById('user-avatar').src = avatar;
                        return;
                    }
                } catch (err) {
                    console.error('Session Error:', err);
                }
            }

            // ถ้าไม่มี Token หรือ Token หมดอายุ ให้แจ้งเตือนผู้ใช้
            document.getElementById('user-name').textContent = 'ไม่ได้ล็อกอิน';
            document.getElementById('user-status').textContent = '● สิทธิ์ผู้เข้าชม';
            document.getElementById('user-status').className = 'text-[9px] font-medium text-amber-400 leading-none mt-0.5';
        }

        // 🔙 ปุ่มย้อนกลับไปหน้าหลัก (index (30).html)
        function goBackMain() {
            // หากต้องการส่ง Token กลับด้วย หรือกลับไปหน้าเดิม
            window.location.href = 'index.html'; 
        }

        // 🎨 แสดงสินค้าทั้งหมด
        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-xs">ไม่พบรายการไอดีที่ตรงกับการค้นหา</div>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="glass-card rounded-2xl overflow-hidden border border-white/10 flex flex-col justify-between hover:border-amber-500/50 transition duration-300 group">
                    <div>
                        <!-- รูปไอดี & Badges -->
                        <div class="relative h-44 overflow-hidden bg-slate-900">
                            <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <div class="absolute top-2 left-2 flex flex-wrap gap-1">
                                ${item.badges.map(b => `<span class="bg-slate-950/80 backdrop-blur-md text-amber-300 border border-amber-400/30 text-[10px] font-bold px-2 py-0.5 rounded-md">${b}</span>`).join('')}
                            </div>
                            <span class="absolute bottom-2 right-2 bg-black/80 backdrop-blur-md text-slate-300 text-[10px] px-2 py-0.5 rounded-md border border-white/10 font-mono">
                                ID: ${item.id}
                            </span>
                        </div>

                        <!-- รายละเอียดไอดี -->
                        <div class="p-4 space-y-2">
                            <h3 class="text-xs font-bold text-slate-100 line-clamp-2 leading-relaxed">${item.title}</h3>
                            <div class="flex items-center gap-1.5 text-[11px] text-slate-400">
                                <i class="fa-solid fa-link text-amber-400"></i>
                                <span>การผูกมัด: <strong class="text-slate-200">${item.bind}</strong></span>
                            </div>

                            <!-- Highlights -->
                            <ul class="text-[11px] text-slate-400 space-y-1 bg-slate-900/60 p-2.5 rounded-xl border border-white/5">
                                ${item.highlights.map(h => `<li class="flex items-center gap-1.5"><i class="fa-solid fa-check text-emerald-400 text-[9px]"></i> <span class="truncate">${h}</span></li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <!-- ด้านล่าง: ราคา & ปุ่มสั่งซื้อ -->
                    <div class="p-4 pt-0 flex items-center justify-between mt-2">
                        <div>
                            <span class="text-[10px] text-slate-500 line-through">฿${item.oldPrice.toLocaleString()}</span>
                            <p class="text-lg font-black gold-gradient-text leading-none">฿${item.price.toLocaleString()}</p>
                        </div>
                        <button onclick="openBuyModal('${item.id}')" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xs px-4 py-2 rounded-xl shadow-lg shadow-amber-500/20 active:scale-95 transition">
                            ดูรายละเอียด & สั่งซื้อ
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 🔍 กรองข้อมูลตามคำค้นหา
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = products.filter(p => {
                return p.title.toLowerCase().includes(query) || p.id.toLowerCase().includes(query);
            });
            renderProducts(filtered);
        }

        // 💳 เปิด Modal ซื้อสินค้า
        function openBuyModal(productId) {
            const item = products.find(p => p.id === productId);
            if (!item) return;

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="text-center space-y-2">
                    <span class="text-[10px] font-extrabold text-amber-400 bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-full">รายละเอียดการสั่งซื้อ</span>
                    <h3 class="text-base font-bold text-white mt-1">${item.title}</h3>
                    <p class="text-2xl font-black gold-gradient-text">฿${item.price.toLocaleString()}</p>
                </div>

                <div class="my-4 bg-slate-900/80 p-3.5 rounded-2xl border border-white/10 space-y-2 text-xs">
                    <div class="flex justify-between border-b border-white/5 pb-2">
                        <span class="text-slate-400">รหัสไอดี:</span>
                        <span class="font-bold text-amber-300 font-mono">${item.id}</span>
                    </div>
                    <div class="flex justify-between border-b border-white/5 pb-2">
                        <span class="text-slate-400">การผูกบัญชี:</span>
                        <span class="font-bold text-slate-200">${item.bind}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400">สถานะรับประกัน:</span>
                        <span class="font-bold text-emerald-400">รับประกันไอดีสะอาด 100%</span>
                    </div>
                </div>

                <!-- ขั้นตอนหลังสั่งซื้อ -->
                <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 text-[11px] text-amber-200 leading-relaxed">
                    📨 เมื่อกดยืนยัน ระบบจะส่งคำสั่งซื้อให้แอดมิน จากนั้นรอแอดมินตอบกลับในกล่องจดหมายที่หน้าหลัก
                </div>

                <button id="confirm-btn" onclick="confirmOrder('${item.id}')" class="w-full mt-5 py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black rounded-xl text-xs shadow-lg shadow-amber-500/20 transition active:scale-95">
                    ยืนยันสั่งซื้อ
                </button>
            `;

            document.getElementById('buyModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('buyModal').classList.add('hidden');
        }

        // 📨 ส่งคำสั่งซื้อไปที่เซิร์ฟเวอร์ Render → ยิงเข้า Discord แอดมิน
        const ORDER_API_BASE = 'https://true-munny-give.onrender.com';

        async function confirmOrder(id) {
            const item = products.find(p => p.id === id);
            if (!item) return;
            if (!userSessionToken) {
                alert('กรุณาเข้าสู่ระบบจากหน้าหลักก่อนสั่งซื้อ');
                return;
            }

            const btn = document.getElementById('confirm-btn');
            const reset = function () {
                if (btn) { btn.disabled = false; btn.classList.remove('opacity-60'); btn.textContent = 'ยืนยันสั่งซื้อ'; }
            };
            if (btn) { btn.disabled = true; btn.classList.add('opacity-60'); btn.textContent = 'กำลังส่งคำสั่งซื้อ...'; }

            try {
                const res = await fetch(ORDER_API_BASE.replace(/\/+$/, '') + '/api/order-id', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + userSessionToken },
                    body: JSON.stringify({ id: item.id, title: item.title, price: item.price, img: item.img })
                });
                const json = await res.json().catch(function () { return {}; });
                if (!res.ok) {
                    alert(json.error || 'สั่งซื้อไม่สำเร็จ');
                    reset();
                    return;
                }
                showOrderSent(item);
            } catch (err) {
                console.error(err);
                alert('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ ลองใหม่อีกครั้ง');
                reset();
            }
        }

        // ✅ หน้าต่างแจ้งเตือนหลังสั่งซื้อสำเร็จ
        function showOrderSent(item) {
            document.getElementById('modalContent').innerHTML =
                '<div class="text-center space-y-3 py-2">' +
                  '<div class="text-4xl">📨</div>' +
                  '<h3 class="text-base font-bold text-emerald-300">สั่งซื้อเรียบร้อยแล้ว</h3>' +
                  '<p class="text-xs text-slate-300">รหัสไอดี <span class="font-mono font-bold text-amber-300">' + item.id + '</span></p>' +
                  '<p class="text-xs text-slate-400 leading-relaxed">กรุณารอแอดมินตอบกลับ<br>และตรวจสอบข้อความที่ <b class="text-amber-300">กล่องจดหมายในหน้าหลัก</b></p>' +
                  '<button onclick="closeModal()" class="w-full mt-2 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-extrabold rounded-xl text-sm">ตกลง</button>' +
                '</div>';
        }

        // เริ่มทำงานเมื่อเปิดหน้าเว็บ
        window.addEventListener('DOMContentLoaded', () => {
            initSession();
            renderProducts(products);
        });
    </script>
</body>
</html>
