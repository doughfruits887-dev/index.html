<style>

button{font:inherit;color:inherit;background:#e3e8ee;border:0;border-radius:8px;padding:8px 12px}

/* ===== patch.css =====
   

/* บล็อกเคอร์เซอร์/การคลุมดำ (ยกเว้นช่องกรอก) */
body *:not(#user-uid):not(input):not(textarea)not(#ta){
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none}

/* พื้นหลัง + สีสันหน้าหลัก */
body{background:linear-gradient(160deg,#e0e7ff 0%,#fce7f3 55%,#dcfce7 100%) fixed}
#app{position:relative;z-index:1}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:none}
header{background:linear-gradient(135deg,#6366f1,#06b6d4);color:#fff;border-bottom:0;box-shadow:0 4px 14px #4f46e544}

/* ช่องค้นหาแบบแคปซูล + แว่นขยายท้ายช่อง */
.sr{padding:12px}
#q{border-radius:999px;padding:12px 50px 12px 18px;border:1px solid #c7d2fe;
  background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2.4' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>") no-repeat right 16px center/20px;
  box-shadow:0 4px 12px #6366f122}
#q:focus{outline:0;border-color:#6366f1;box-shadow:0 0 0 3px #6366f133}

/* การ์ดลอย มีเงา */

.ic{position:relative;display:grid;align-items:end;justify-items:center;width:40px;height:50px;padding-bottom:4px;border:0;border-radius:4px 4px 5px 5px;

.sub .ic::before{background:linear-gradient(225deg,#f8fafc 50%,#c7d2fe 50%)}
.ic::after{content:"";position:absolute;left:6px;right:6px;top:18px;height:11px;background:repeating-linear-gradient(#c7d2fe 0 2px,transparent 2px 6px)}

/* เมนู 3 จุด = ป๊อปอัปลอยข้างปุ่ม / กล่องยืนยันอยู่กลางจอ */

/* หน้าล็อกอิน */
.lw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;overflow:auto}
.lamp{position:relative;width:130px;height:96px;margin-bottom:-4px;z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lamp svg{display:block;margin:0 auto;overflow:visible}

.bulb{fill:#475569;transition:fill .3s,filter .3s}
.beam{position:absolute;left:50%;top:70px;width:min(430px,96vw);height:320px;transform:translateX(-50%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);
  background:linear-gradient(var(--lc,transparent),transparent 85%);opacity:0;transition:opacity .4s;pointer-events:none;z-index:-1}
.l1{--lc:#ffffffcc}.l2{--lc:#ffd54acc}
.l1 .beam,.l2 .beam{opacity:.9}
.l1 .bulb{fill:#fff;filter:drop-shadow(0 0 8px #fff)}
.l2 .bulb{fill:#ffd54a;filter:drop-shadow(0 0 8px #ffd54a)}
.lcard{position:relative;z-index:3;width:min(360px,100%);background:#fff;border-radius:22px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:12px;
  filter:brightness(.8);box-shadow:0 16px 40px #0006,0 2px 6px #0004;transition:box-shadow .4s,filter .4s}
.l1 .lcard{filter:none;box-shadow:0 0 0 1px #fff6,0 0 50px 8px #ffffff88,0 18px 40px #0005}
.l2 .lcard{filter:none;box-shadow:0 0 0 1px #ffd54a66,0 0 50px 8px #ffd54a88,0 18px 40px #0005}
.lcard h1{margin:0;text-align:center;font-size:24px;color:#312e81}
.lcard form{display:flex;flex-direction:column;gap:10px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#eef1f4;border-radius:12px;padding:4px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:#fff;border-radius:9px;box-shadow:0 2px 6px #0002;transition:transform .25s}
.seg.in i{transform:translateX(100%)}
.seg button{position:relative;background:none;padding:8px;font-weight:600;color:var(--mut)}
.seg.up button:nth-of-type(1),.seg.in button:nth-of-type(2){color:var(--ink)}
.pwm{height:7px;border-radius:9px;background:#e5e9ef;overflow:hidden}
.pwm b{display:block;height:100%;width:0;border-radius:9px;transition:width .3s,background .3s}
.pwt{font-size:13px;min-height:1.2em;color:var(--mut)}
.sw{margin:0;text-align:center;color:var(--mut);font-size:14px}
.sw a{color:#2563eb;font-weight:600;cursor:pointer;text-decoration:underline}

</style></head><body><div id="app"></div>
<script>
const HOST='';/* ใส่โดเมนของคุณ เช่น 'myhost.com' ลิงก์จะเป็น https://myhost.com/ชื่อลิงก์ ถ้าเว้นว่างจะใช้ที่อยู่ของเว็บนี้ */
const sb=supabase.createClient('https://ztkqtvdllpzjsvlqxzni.supabase.co','sb_publishable_BkDeJmZYwMys8OP4eMkpVQ_F6hrJ35t',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'fm-auth'}});
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ext=n=>n.includes('.')?n.split('.').pop().toLowerCase():'';
const LINK=id=>location.origin+location.pathname+'?v='+id;
const META='id,parent_id,name,is_binary,mime,shared,slug,updated_at';
let user=null,files=[],q='',ed=null,tab=null,warns=[],tm,fqv='',upP=null;
const kids=f=>files.filter(x=>x.parent_id===f.id);
const toast=m=>{let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(tm);tm=setTimeout(()=>t.hidden=true,2600)};
function b64(u){let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function sheet(items,msg){const d=document.createElement('div');d.className='sh';const c=document.createElement('div');if(msg){const p=document.createElement('p');p.textContent=msg;c.appendChild(p)}
 items.forEach(([t,fn,cl])=>{const b=document.createElement('button');b.textContent=t;if(cl)b.className=cl;b.onclick=()=>{d.remove();fn&&fn()};c.appendChild(b)});
 d.onclick=e=>{if(e.target===d)d.remove()};d.appendChild(c);document.body.appendChild(d)}

/* ---------- แสดงลิงก์ถาวร (ไม่ต้องล็อกอิน) / ตัวรันไฟล์ ---------- */
function build(fs){const m=fs.find(f=>/\.html?$/i.test(f.name))||fs.find(f=>f.main)||fs[0],e=ext(m.name);
 const by=u=>fs.find(f=>f!==m&&f.name===u.split(/[?#]/)[0].split('/').pop());
 if(m.is_binary)return(m.mime||'').startsWith('image/')?'<img style="max-width:100%" src="data:'+m.mime+';base64,'+m.content+'">':'<p style="font:16px sans-serif;padding:16px">ไฟล์นี้ไม่ใช่ข้อความ เปิดดูในเว็บไม่ได้ ให้ดาวน์โหลดแทน</p>';
 if(e==='html'||e==='htm'){let h=m.content;
  h=h.replace(/<link\b[^>]*href=["']([^"']+)["'][^>]*>/gi,(t,u)=>{const f=by(u);return f&&/stylesheet/i.test(t)?'<style>'+f.content+'</style>':t});
  return h.replace(/<script\b([^>]*?)src=["']([^"']+)["']([^>]*)>\s*<\/script>/gi,(t,a,u,b)=>{const f=by(u);return f?'<script'+a+b+'>'+f.content.replace(/<\/script/gi,'<\\/script')+'<\/script>':t})}
 if(e==='svg')return m.content;
 if(['js','mjs'].includes(e)){if(/\brequire\(|\bprocess\.|\bmodule\.exports/.test(m.content))return'<p style="font:16px sans-serif;padding:16px">ไฟล์นี้ใช้ Node (require/process) รันในเบราว์เซอร์ไม่ได้ ต้องรันบนเซิร์ฟเวอร์ที่มี Node</p>';
  return'<body style="font:14px monospace;padding:12px;white-space:pre-wrap"><div id=o></div><script>const o=document.getElementById("o"),p=(c,a)=>{const d=document.createElement("div");d.style.color=c;d.textContent=a.map(x=>typeof x==="object"?JSON.stringify(x):String(x)).join(" ");o.append(d)};console.log=(...a)=>p("#111",a);console.error=(...a)=>p("#c00",a);onerror=(m,s,l)=>p("#c00",["Error: "+m+" (บรรทัด "+l+")"]);<\/script><script>'+m.content.replace(/<\/script/gi,'<\\/script')+'<\/script>'}
 const srv=['py','java','c','cpp','cs','go','rs','php','rb','sh','kt','swift','sql'].includes(e)?'<p style="font:14px sans-serif;color:#92400e">ภาษานี้ต้องมีตัวรันบนเซิร์ฟเวอร์ รันในเบราว์เซอร์ไม่ได้ จึงแสดงเป็นข้อความ</p>':'';
 return srv+'<pre style="white-space:pre-wrap;font:14px monospace;padding:12px">'+esc(m.content)+'</pre>'}
function frame(fs){const f=document.createElement('iframe');f.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-modals');f.srcdoc=build(fs);return f}
async function viewer(o,soft){if(!soft)document.body.innerHTML='<p style="padding:20px">กำลังโหลด...</p>';
 const{data}=await(o.slug?sb.rpc('fm_public_by_slug',{p_slug:o.slug}):sb.rpc('fm_public_bundle',{p_id:o.id}));
 if(!data){if(soft)return false;document.body.innerHTML='<p style="padding:20px">ไม่พบลิงก์นี้ หรือเจ้าของยังไม่ได้สร้างลิงก์</p>';return true}
 document.title=data.name;document.body.innerHTML='';const f=frame(data.files);f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff';document.body.appendChild(f);return true}

/* ---------- ล็อกอิน (ชื่อผู้ใช้ + รหัสผ่าน จำในเครื่อง) ---------- */
function loginView(err,u){$('#app').innerHTML=`<div class="login"><h1>ไฟล์ของฉัน</h1><p>เข้าสู่ระบบเพื่อจัดการไฟล์และแก้ไขโค้ด</p><input id="u" placeholder="ชื่อผู้ใช้ (a-z 0-9 _)" autocapitalize="off" value="${esc(u||'')}"><input id="p" type="password" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)"><div class="err">${esc(err||'')}</div><button class="pri" onclick="auth(0)">เข้าสู่ระบบ</button><button onclick="auth(1)">สมัครสมาชิก</button></div>`}
async function auth(reg){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;
 if(!/^[a-z0-9_]{3,20}$/.test(u))return loginView('ชื่อผู้ใช้ใช้ a-z 0-9 _ ยาว 3-20 ตัว',u);

 const email=u+'@fm.example.com',r=reg?await sb.auth.signUp({email,password:p,options:{data:{username:u}}}):await sb.auth.signInWithPassword({email,password:p});
 if(r.error)return loginView(/Invalid login/.test(r.error.message)?'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง':/already/.test(r.error.message)?'ชื่อนี้มีคนใช้แล้ว':r.error.message,u);
 if(!r.data.session)return loginView('สมัครแล้ว แต่เข้าไม่ได้: ต้องปิด Confirm email ใน Supabase ก่อน',u);
 user=r.data.session.user;await load();list()}
async function logout(){await sb.auth.signOut();user=null;files=[];loginView()}

/* ---------- หน้ารายการไฟล์ ---------- */
async function load(){const{data,error}=await sb.from('fm_files').select(META).order('created_at');if(error)toast('โหลดไม่สำเร็จ: '+error.message);files=data||[]}

 return true}

const R_STR=/"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?|`(?:\\[\s\S]|[^`\\])*`?/.source;
const R_CM={c:/\/\*[\s\S]*?(?:\*\/|$)|\/\/[^\n]*/.source,h:/#[^\n]*/.source,d:/--[^\n]*/.source,css:/\/\*[\s\S]*?(?:\*\/|$)/.source};
const HJ=new Set('function return const let var if else for while do switch case break continue new class extends import export from default async await try catch finally throw typeof instanceof in of delete void yield static this super public private protected final package using namespace struct enum interface abstract implements fn mut impl pub use mod match'.split(' '));
const HP=new Set('def class return import from as if elif else for while try except finally with lambda yield pass break continue raise assert global nonlocal in not and or is then fi done esac function local export'.split(' '));
const HS=new Set('select from where insert into values update set create table alter drop join group order by having limit distinct union and or not null as on left right inner outer'.split(' '));
const HC=new Set('true false null undefined NaN None True False nil'.split(' '));
function hlCode(code,lang){
 const css=lang==='css',cm=css?'css':(lang==='py'||lang==='sh')?'h':lang==='sql'?'d':'c',K=(lang==='py'||lang==='sh')?HP:lang==='sql'?HS:HJ;
 const re=new RegExp('('+R_CM[cm]+')|('+R_STR+')|'+(css?'([.#][\\w-]+)|(@?-?[A-Za-z_][\\w-]*)':'()([A-Za-z_$][\\w$]*)')+'|(\\b\\d[\\w.]*)','g');
 let out='',last=0,m;
 while(m=re.exec(code)){
  out+=esc(code.slice(last,m.index));last=re.lastIndex;
  const t=m[0];let c='';
  if(m[1])c='#6e7781';else if(m[2])c='#0a3069';else if(m[5])c='#0550ae';else if(m[3])c='#0550ae';
  else{const nx=code.slice(re.lastIndex,re.lastIndex+40).match(/^\s*([(:])/);
   if(css)c=t[0]==='@'?'#cf222e':(nx&&nx[1]===':'?'#0550ae':'');
   else if(K.has(lang==='sql'?t.toLowerCase():t))c='#cf222e';
   else if(HC.has(t))c='#0550ae';
   else if(nx&&nx[1]==='(')c='#8250df';
   else if(/^[A-Z]/.test(t))c='#953800'}
  out+=c?'<span style="color:'+c+'">'+esc(t)+'</span>':esc(t)}

function hlTag(s){const m=/^(<\/?)([\w:-]+)([\s\S]*?)(\/?>?)$/.exec(s);if(!m)return esc(s);
 let a='',l=0,x;const r=/([^\s=]+)(\s*=\s*)?("[^"]*"|'[^']*'|[^\s"'>]+)?/g;
 while(x=r.exec(m[3])){a+=esc(m[3].slice(l,x.index))+'<span style="color:#0550ae">'+esc(x[1])+'</span>'+esc(x[2]||'')+(x[3]?'<span style="color:#0a3069">'+esc(x[3])+'</span>':'');l=r.lastIndex}
 return esc(m[1])+'<span style="color:#116329">'+esc(m[2])+'</span>'+a+esc(m[3].slice(l))+esc(m[4])}
function hlHtml(code){
 const re=/(<!--[\s\S]*?(?:-->|$))|(<(script|style)\b[^>]*>)([\s\S]*?)(<\/\3\s*>|$)|(<\/?[A-Za-z][^>]*>?)/gi;
 let out='',last=0,m;
 while(m=re.exec(code)){
  out+=esc(code.slice(last,m.index));last=re.lastIndex;
  if(m[1])out+='<span style="color:#6e7781">'+esc(m[1])+'</span>';
  else if(m[2]){const L=m[3].toLowerCase()==='style'?'css':'js';
   out+=hlTag(m[2])+(/\bsrc\s*=/i.test(m[2])?esc(m[4]):hlCode(m[4],L))+(m[5]?hlTag(m[5]):'')}
  else out+=hlTag(m[6])}
 return out+esc(code.slice(last))}
function hl(name,code){const e=ext(name);if(code.length>150000)return null;
 if(/^(html?|xml|svg|xhtml)$/.test(e))return hlHtml(code);
 if(/^(css|scss|less)$/.test(e))return hlCode(code,'css');
 if(/^(py|pyw)$/.test(e))return hlCode(code,'py');
 if(/^(sh|bash|zsh|yml|yaml|toml|conf|ini|rb|env)$/.test(e))return hlCode(code,'sh');

 G.sn=Array.from({length:110},()=>({x:R()*W,y:R()*H,r:1+R()*2.4,v:25+R()*45,p:R()*6.3}));
 G.st=Array.from({length:70},()=>({x:R()*W,y:R()*H*.6,r:.5+R()*1.2,p:R()*6.3}));
 G.cd=Array.from({length:5},()=>({x:R()*W,y:H*(.08+R()*.25),s:.6+R()*.8,v:6+R()*8}))}
function bgOn(){if(!bgCv){bgCv=document.createElement('canvas');bgCv.id='bg';document.body.prepend(bgCv);
  addEventListener('resize',()=>{if(bgCv.style.display==='block')bgInit()})}
 bgCv.style.display='block';bgInit();bgLast=0;cancelAnimationFrame(bgRaf);bgRaf=requestAnimationFrame(bgLoop)}
function bgOff(){if(bgCv)bgCv.style.display='none';cancelAnimationFrame(bgRaf)}
function bgLoop(now){if(!bgCv||bgCv.style.display!=='block')return;bgRaf=requestAnimationFrame(bgLoop);
 const t=(now-bgT0)/1000,dt=Math.min(.05,(now-(bgLast||now))/1000);bgLast=now;
 const x=t%120,d=clp(.5+.8*Math.sin(x/120*6.2832),0,1),k=Math.floor((t%90)/30),r=clp((((t%90)%30)/30)/.1,0,1),
  wr=k===1?r:k===2?1-r:0,ws=k===2?r:k===0?1-r:0;
 // ท้องฟ้า
 let top=mx([10,14,38],[120,200,255],d),bot=mx([28,44,84],[215,240,255],d);
 top=mx(top,mx([60,68,82],[110,122,138],d),wr*.85);bot=mx(bot,mx([90,100,115],[160,172,186],d),wr*.85);
 top=mx(top,mx([90,100,120],[170,182,200],d),ws*.8);bot=mx(bot,mx([140,150,165],[228,234,242],d),ws*.8);
 const sk=bx.createLinearGradient(0,0,0,H*.85);sk.addColorStop(0,rg(top));sk.addColorStop(1,rg(bot));bx.fillStyle=sk;bx.fillRect(0,0,W,H);
 // ดาว
 const sa=(1-d)*(1-wr*.9)*(1-ws*.7);
 if(sa>.02){bx.fillStyle='#fff';G.st.forEach(s=>{bx.globalAlpha=sa*(.5+.5*Math.sin(t*1.5+s.p));bx.fillRect(s.x,s.y,s.r,s.r)});bx.globalAlpha=1}
 // ดวงอาทิตย์ (ครึ่งแรก) / พระจันทร์ (ครึ่งหลัง)
 const fr=(x%60)/60,sx=W*(.08+.84*fr),sy=H*.8-Math.sin(Math.PI*fr)*H*.62,cv=1-clp(wr*.8+ws*.5,0,1);
 if(cv>.05){bx.globalAlpha=cv;const sun=x<60,rad=Math.min(W,H)*.07+10,gl=bx.createRadialGradient(sx,sy,rad*.4,sx,sy,rad*3.2);
  gl.addColorStop(0,sun?'rgba(255,220,120,.55)':'rgba(220,230,255,.35)');gl.addColorStop(1,'rgba(255,255,255,0)');
  bx.fillStyle=gl;bx.fillRect(sx-rad*3.2,sy-rad*3.2,rad*6.4,rad*6.4);
  bx.fillStyle=sun?'#ffd45a':'#f4f1da';bx.beginPath();bx.arc(sx,sy,rad,0,6.2832);bx.fill();
  if(!sun){bx.fillStyle='rgba(150,150,130,.35)';[[-.3,-.2,.22],[.25,.15,.16],[-.1,.38,.12]].forEach(c=>{bx.beginPath();bx.arc(sx+c[0]*rad,sy+c[1]*rad,c[2]*rad,0,6.2832);bx.fill()})}
  bx.globalAlpha=1}
 // เมฆ (ตอนฝน/หิมะ)
 const ca=clp(wr+ws,0,1)*.85;
 if(ca>.02){bx.fillStyle=rg(mx([70,78,92],[235,240,246],clp(d*(1-wr*.5)+ws*.15,0,1)));bx.globalAlpha=ca;
  G.cd.forEach(c=>{c.x+=c.v*dt;if(c.x>W+120)c.x=-160;[[0,0,34],[34,6,26],[-32,8,24],[10,-14,26]].forEach(p=>{bx.beginPath();bx.arc(c.x+p[0]*c.s,c.y+p[1]*c.s,p[2]*c.s,0,6.2832);bx.fill()})});bx.globalAlpha=1}
 // พื้นหญ้า (หิมะตกแล้วพื้นขาว)
 const gc=mx(mx([14,40,30],[64,150,70],d),mx([120,132,150],[238,244,250],d),ws),hill=bx.createLinearGradient(0,H*.76,0,H);
 hill.addColorStop(0,rg(gc));hill.addColorStop(1,rg(gc.map(v=>v*.55)));
 bx.fillStyle=hill;bx.beginPath();bx.moveTo(0,H*.82);bx.quadraticCurveTo(W*.3,H*.75,W*.6,H*.81);bx.quadraticCurveTo(W*.85,H*.86,W,H*.79);bx.lineTo(W,H);bx.lineTo(0,H);bx.fill();
 // ต้นหญ้าไหวตามลม
 const sway=3+4*(.5+.5*Math.sin(t*.4)),bc=mx(mx([30,80,50],[90,190,80],d),[210,220,232],ws*.9);
 [[bc,true],[bc.map(v=>v*.7),false]].forEach(([c,gg])=>{bx.strokeStyle=rg(c);bx.lineWidth=1.6;bx.beginPath();
  G.bl.forEach(b=>{if(b.g!==gg)return;const o=Math.sin(t*1.3+b.p+b.x*.012)*sway;bx.moveTo(b.x,b.y);bx.quadraticCurveTo(b.x,b.y-b.h*.6,b.x+o,b.y-b.h)});bx.stroke()});
 // หิ่งห้อย บินวนช้า ๆ
 const fa=Math.max(.12,1-d)*(1-wr*.7)*(1-ws*.8);
 G.fl.forEach(o=>{const px=o.x+Math.cos(t*o.s+o.p)*o.r,py=o.y+Math.sin(t*o.s*1.3+o.p)*o.r*.6,a=fa*(.55+.45*Math.sin(t*o.s*5+o.p));if(a<.02)return;
  const gr=bx.createRadialGradient(px,py,0,px,py,11);gr.addColorStop(0,'rgba(240,255,150,'+a+')');gr.addColorStop(.35,'rgba(200,255,90,'+a*.45+')');gr.addColorStop(1,'rgba(200,255,90,0)');
  bx.fillStyle=gr;bx.fillRect(px-11,py-11,22,22)});
 // ฝน
 if(wr>.02){bx.strokeStyle='rgba(200,215,240,'+.5*wr+')';bx.lineWidth=1;bx.beginPath();
  G.rn.forEach(p=>{p.y+=p.v*dt;p.x-=p.v*.12*dt;if(p.y>H){p.y=-20;p.x=Math.random()*W*1.2}bx.moveTo(p.x,p.y);bx.lineTo(p.x-p.l*.12,p.y+p.l)});bx.stroke()}
 // หิมะ
 if(ws>.02){bx.fillStyle='rgba(255,255,255,'+.9*ws+')';
  G.sn.forEach(p=>{p.y+=p.v*dt;p.x+=Math.sin(t+p.p)*18*dt;if(p.y>H){p.y=-6;p.x=Math.random()*W}bx.beginPath();bx.arc(p.x,p.y,p.r,0,6.2832);bx.fill()})}}

// ---------- หน้าล็อกอิน / สมัครสมาชิก + โคมไฟ ----------
// lp = สถานะโคมไฟ: 0 ดับ, 1 ไฟขาว (หน้าสมัคร), 2 ไฟเหลือง (หน้าเข้าสู่ระบบ)
// lm = หน้าที่แสดง: 'up' สมัคร / 'in' เข้าสู่ระบบ (เครื่องที่เคยเข้าแล้วเริ่มที่ 'in')
let lp=0,lm=(()=>{try{return localStorage.getItem('fm-acct')?'in':'up'}catch(e){return'up'}})();
const pwScore=p=>{if(!p)return 0;let s=(p.length>=6)+(p.length>=10)+(/[a-z]/.test(p)&&/[A-Z]/.test(p))+(/\d/.test(p))+(/[^A-Za-z0-9]/.test(p));
 if(/^(.)\1+$/.test(p)||/^(123456|password|qwerty|abc123|111111|12345678)/i.test(p))s=Math.min(s,1);return s};
function pw(v){const s=pwScore(v),c=s<=2?'#dc2626':s===3?'#f59e0b':'#16a34a',
 t=!v?'ผสมตัวพิมพ์ใหญ่ เล็ก ตัวเลข และสัญลักษณ์ ยิ่งปลอดภัย':s<=2?'เดาง่าย — เพิ่มตัวพิมพ์ใหญ่ ตัวเลข สัญลักษณ์':s===3?'ปานกลาง — เพิ่มอีกนิดจะปลอดภัยขึ้น':'ปลอดภัยมาก';
 $('#pwb').style.cssText='width:'+(v?Math.max(12,s*20):0)+'%;background:'+c;$('#pwt').textContent=t;$('#pwt').style.color=v?c:''}
function loginView(err,u){bgOn();
 $('#app').innerHTML=`<div class="lw l${lp}" id="lw"><div class="lamp" onclick="lamp()" title="กดเพื่อเปิด/ปิดไฟ"><svg viewBox="0 0 130 96" width="130" height="96"><path d="M28 62Q32 32 65 30Q98 32 102 62Z" fill="#334155"/><rect x="24" y="60" width="82" height="6" rx="3" fill="#1e293b"/><ellipse class="bulb" cx="65" cy="71" rx="15" ry="6"/></svg><div class="beam"></div></div>
<div class="lcard"><h1>ไฟล์ของฉัน</h1><div class="seg ${lm}" id="sg"><i></i><button type="button" onclick="mode('up')">สมัครสมาชิก</button><button type="button" onclick="mode('in')">เข้าสู่ระบบ</button></div><div id="lf"></div></div></div>`;
 card(err,u)}
function card(err,u){const up=lm==='up';
 $('#lf').innerHTML=`<form onsubmit="auth(${up?1:0});return false"><input id="u" placeholder="${up?'ชื่อผู้ใช้ (5 ตัวขึ้นไป a-z 0-9 _)':'ชื่อผู้ใช้'}" autocapitalize="off" autocomplete="username" value="${esc(u||'')}"><input id="p" type="password" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)" ${up?'oninput="pw(this.value)" autocomplete="new-password"':'autocomplete="current-password"'}>${up?'<div class="pwm"><b id="pwb"></b></div><div class="pwt" id="pwt">ผสมตัวพิมพ์ใหญ่ เล็ก ตัวเลข และสัญลักษณ์ ยิ่งปลอดภัย</div><input id="p2" type="password" placeholder="ยืนยันรหัสผ่านอีกครั้ง" autocomplete="new-password">':''}<div class="err">${esc(err||'')}</div><button class="pri" type="submit">${up?'สมัครสมาชิก':'เข้าสู่ระบบ'}</button></form><p class="sw">${up?'มีบัญชีแล้ว? <a onclick="mode(\'in\')">เข้าสู่ระบบ</a>':'ยังไม่มีบัญชี? <a onclick="mode(\'up\')">สมัครสมาชิก</a>'}</p>`}
function mode(m){const u=($('#u')||{}).value;lm=m;lp=m==='up'?1:2;$('#sg').className='seg '+m;$('#lw').className='lw l'+lp;card('',u)}
function lamp(){const u=($('#u')||{}).value;lp=(lp+1)%3;if(lp===1)lm='up';if(lp===2)lm='in';
 $('#sg').className='seg '+lm;$('#lw').className='lw l'+lp;card('',u)}
async function auth(reg){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value,bad=m=>card(m,u);
 if(!/^[a-z0-9_]+$/.test(u)||u.length>20||u.length<(reg?5:3))return bad(reg?'ชื่อผู้ใช้ต้อง 5-20 ตัว ใช้ a-z 0-9 _ เท่านั้น':'ชื่อผู้ใช้ใช้ a-z 0-9 _ ยาว 3-20 ตัว');
 if(p.length<6)return bad('รหัสผ่านอย่างน้อย 6 ตัว');
 if(reg&&p!==$('#p2').value)return bad('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
 const email=u+'@fm.example.com',r=reg?await sb.auth.signUp({email,password:p,options:{data:{username:u}}}):await sb.auth.signInWithPassword({email,password:p});
 if(r.error){const m=r.error.message;
  if(!reg&&/Invalid login/.test(m)&&!(()=>{try{return localStorage.getItem('fm-acct')}catch(e){}})()){mode('up');return card('ยังไม่พบบัญชีนี้ กรุณาสมัครสมาชิกก่อน',u)}
  return bad(/Invalid login/.test(m)?'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง':/already/.test(m)?'ชื่อนี้มีคนใช้แล้ว':m)}
 if(!r.data.session)return bad('สมัครแล้ว แต่เข้าไม่ได้: ต้องปิด Confirm email ใน Supabase ก่อน');
 try{localStorage.setItem('fm-acct','1')}catch(e){}
 user=r.data.session.user;await load();list()}

/* ---------- เริ่มต้น ---------- */
(async()=>{const v=new URLSearchParams(location.search).get('v');if(v)return viewer({id:v});
 const seg=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');
 if(/^[a-z0-9][a-z0-9_-]{1,39}$/i.test(seg)&&await viewer({slug:seg.toLowerCase()},true))return;
 const{data:{session}}=await sb.auth.getSession();if(!session)return loginView();user=session.user;await load();list()})();
</script></body></html>
